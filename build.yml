name: Build KizzDev APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate project
        run: |
          mkdir -p proj
          echo '' | base64 -d > proj/settings.gradle
          mkdir -p proj
          echo 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC41LjInIGFwcGx5IGZhbHNlIH0K' | base64 -d > proj/build.gradle
          mkdir -p proj
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyZwphbmRyb2lkLnVzZUFuZHJvaWRYPXRydWUKYW5kcm9pZC5ub25UcmFuc2l0aXZlUkNsYXNzPXRydWUK' | base64 -d > proj/gradle.properties
          mkdir -p proj/app
          echo '' | base64 -d > proj/app/build.gradle
          mkdir -p proj/app/src/main
          echo '' | base64 -d > proj/app/src/main/AndroidManifest.xml
          mkdir -p proj/app/src/main/res/drawable
          echo '' | base64 -d > proj/app/src/main/res/drawable/ic_launcher.xml
          mkdir -p proj/app/src/main/java/com/kizzdev/app
          echo '' | base64 -d > proj/app/src/main/java/com/kizzdev/app/MainActivity.java
      - name: Build APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KizzDev-APK
          path: proj/app/build/outputs/apk/debug/*.apk
